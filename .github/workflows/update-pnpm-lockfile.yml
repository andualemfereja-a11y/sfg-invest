name: Update pnpm lockfile

on:
  push:
    paths:
      - 'package.json'
      - '.github/workflows/update-pnpm-lockfile.yml'
  workflow_dispatch:

jobs:
  update-lockfile:
    name: Update pnpm-lock.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable Corepack and pnpm@9
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      - name: Install lockfile only
        run: pnpm install --lockfile-only

      - name: Commit updated pnpm-lock.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml (ci)" || echo "no changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
